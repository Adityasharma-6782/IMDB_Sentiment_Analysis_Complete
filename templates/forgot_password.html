{% extends "base.html" %}
{% block title %}Reset your password — ReelTake{% endblock %}
{% block body_class %}page-auth{% endblock %}

{% block content %}
<section class="auth-wrap wrap">
  <div class="auth-card">
    <p class="eyebrow">Lost &amp; found</p>
    <h1>Forgot your password?</h1>
    <p class="auth-sub">Enter the email on your account and we'll send a reset link.</p>

    <form method="POST" class="auth-form" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="email" required>

      <button type="submit" class="btn btn-gold btn-full">Send reset link</button>
    </form>

    <p class="auth-switch"><a href="{{ url_for('auth.login') }}">&larr; Back to sign in</a></p>
  </div>
</section>
{% endblock %}
