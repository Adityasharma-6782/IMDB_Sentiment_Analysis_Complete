{% extends "base.html" %}
{% block title %}Set a new password — ReelTake{% endblock %}
{% block body_class %}page-auth{% endblock %}

{% block content %}
<section class="auth-wrap wrap">
  <div class="auth-card">
    <p class="eyebrow">Lost &amp; found</p>
    <h1>Set a new password</h1>
    <p class="auth-sub">Make it something you haven't used here before.</p>

    <form method="POST" class="auth-form" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <label for="password">New password</label>
      <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8">

      <label for="confirm_password">Confirm new password</label>
      <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" required minlength="8">

      <button type="submit" class="btn btn-gold btn-full">Update password</button>
    </form>
  </div>
</section>
{% endblock %}
